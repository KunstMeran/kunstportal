<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Projektsoftware Kunst Meran</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-logo">KUNST MERAN</div>
            <p class="login-subtitle">Projektverwaltung</p>

            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="username">Benutzername</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Passwort</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>

                <div id="login-error" class="login-error"></div>

                <button type="submit" class="btn btn-black btn-block">Anmelden</button>
            </form>

            <p style="margin-top: 2rem; font-size: 0.75rem; color: #999;">
                Version 1.0.0 | Controlling Solutions
            </p>
        </div>
    </div>

    <!-- Supabase Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- App Scripts -->
    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Prüfen ob bereits eingeloggt
        (async () => {
            await Auth.checkAlreadyLoggedIn();
        })();

        // Login-Formular Event
        document.getElementById('login-form').addEventListener('submit', Auth.handleLogin);
    </script>
</body>
</html>
