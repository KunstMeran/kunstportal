<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Projektsoftware Kunst Meran</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <img src="logo.png" alt="Kunst Meran" class="login-logo-img">
            <p class="login-subtitle">Projektverwaltung</p>

            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="username">Benutzername</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Passwort</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>

                <div id="login-error" class="login-error"></div>

                <button type="submit" class="btn btn-black btn-block">Anmelden</button>
            </form>

            <!-- Microsoft SSO -->
            <div class="login-divider">
                <span>oder</span>
            </div>

            <button type="button" class="btn btn-microsoft btn-block" onclick="Auth.handleMicrosoftLogin()">
                <svg viewBox="0 0 21 21" width="21" height="21" style="margin-right: 8px;">
                    <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
                    <rect x="11" y="1" width="9" height="9" fill="#00a4ef"/>
                    <rect x="1" y="11" width="9" height="9" fill="#7fba00"/>
                    <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
                </svg>
                Mit Microsoft anmelden
            </button>
            <p class="microsoft-hint">Nur für @kunstmeranoarte.org</p>

            <p style="margin-top: 2rem; font-size: 0.75rem; color: #999;">
                Version 2.0.0 | Controlling Solutions
            </p>
        </div>
    </div>

    <!-- Supabase Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- App Scripts -->
    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Prüfen ob bereits eingeloggt
        (async () => {
            await Auth.checkAlreadyLoggedIn();
        })();

        // Login-Formular Event
        document.getElementById('login-form').addEventListener('submit', Auth.handleLogin);

        // OAuth-Fehler aus URL-Parameter anzeigen
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const error = urlParams.get('error');
            if (error) {
                const errorElement = document.getElementById('login-error');
                if (errorElement) {
                    errorElement.textContent = decodeURIComponent(error);
                    errorElement.classList.add('show');
                }
                // URL bereinigen
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        })();
    </script>
</body>
</html>
